<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boston / NYC Travel Itinerary</title>
  <style>
    :root {
      --ink: #202124;
      --muted: #5f6368;
      --line: #dadce0;
      --soft: #f6f7f8;
      --paper: #ffffff;
      --charcoal: #333333;
      --accent: #1f6feb;
      --warn: #b3261e;
      --radius: 8px;
      --title-font: "Oswald", "Arial Narrow", "Helvetica Neue", sans-serif;
      --body-font: "Source Code Pro", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: #f1f3f4;
      font-family: var(--body-font);
      font-size: 14px;
      line-height: 1.55;
    }

    button, textarea, input {
      font: inherit;
    }

    .app-shell {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 18px;
      padding: 22px 24px;
      color: #f5f5f5;
      background: var(--charcoal);
      border-radius: var(--radius) var(--radius) 0 0;
    }

    h1 {
      margin: 0;
      font-family: var(--title-font);
      font-size: clamp(34px, 6vw, 68px);
      font-weight: 400;
      line-height: .95;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .meta {
      display: grid;
      gap: 5px;
      color: #f5f5f5;
      text-align: right;
      font-size: 13px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 320px) auto auto;
      gap: 10px;
      align-items: center;
      padding: 14px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-top: 0;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab, .icon-button, .send-button, .quick-button {
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--ink);
      border-radius: 7px;
      min-height: 38px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .tab[aria-selected="true"] {
      color: #ffffff;
      background: var(--charcoal);
      border-color: var(--charcoal);
    }

    .search {
      min-width: min(320px, 100%);
      border: 1px solid var(--line);
      border-radius: 7px;
      min-height: 38px;
      padding: 8px 12px;
      background: #ffffff;
    }

    main {
      padding-top: 16px;
    }

    .trip-panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: clip;
    }

    .trip-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
      border-bottom: 1px solid var(--line);
    }

    .summary-cell {
      padding: 12px 14px;
      background: #ffffff;
      min-width: 0;
    }

    .summary-label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
    }

    .day {
      border-bottom: 1px solid var(--line);
    }

    .day:last-child {
      border-bottom: 0;
    }

    .day-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0;
      padding: 12px 14px;
      color: #f5f5f5;
      background: #2c3317;
      font-size: 16px;
      font-weight: 700;
      white-space: pre-line;
    }

    .day-chevron {
      width: 24px;
      height: 24px;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      color: var(--muted);
      transition: transform .16s ease;
    }

    details.item {
      border-top: 1px solid var(--line);
      background: #ffffff;
    }

    details.item:first-of-type {
      border-top: 0;
    }

    summary {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr) 28px;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      cursor: pointer;
      list-style: none;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    .when {
      color: var(--accent);
      overflow-wrap: anywhere;
    }

    .what {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .what strong {
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .where {
      color: var(--muted);
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

    .chevron {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      color: var(--muted);
      transition: transform .16s ease;
    }

    details.item[open] > summary .chevron,
    details.day[open] > summary .day-chevron {
      transform: rotate(90deg);
    }

    .details {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 12px;
      padding: 0 14px 14px;
      color: var(--ink);
    }

    .detail-body {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .memo {
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    a {
      color: #0b57d0;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .cost {
      display: inline-flex;
      width: fit-content;
      max-width: 100%;
      padding: 3px 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      background: var(--soft);
      overflow-wrap: anywhere;
    }

    .hidden {
      display: none !important;
    }

    .lock-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      background: #f1f3f4;
    }

    .lock-panel {
      width: min(420px, 100%);
      padding: 24px;
      color: #f5f5f5;
      background: var(--charcoal);
      border-radius: var(--radius);
    }

    .lock-panel h1 {
      margin-bottom: 16px;
      font-size: 38px;
    }

    .lock-form {
      display: grid;
      gap: 10px;
    }

    .lock-form label {
      font-size: 12px;
      text-transform: uppercase;
    }

    .lock-form input {
      min-height: 42px;
      border: 1px solid #616161;
      border-radius: 7px;
      padding: 9px 11px;
      color: var(--ink);
      background: #ffffff;
    }

    .unlock-button {
      min-height: 42px;
      border: 1px solid #f5f5f5;
      border-radius: 7px;
      color: #f5f5f5;
      background: transparent;
      cursor: pointer;
    }

    .lock-error {
      min-height: 20px;
      color: #ffd7d3;
      font-size: 12px;
    }

    @media (max-width: 900px) {
      header, main, .toolbar {
        grid-template-columns: 1fr;
      }

      .meta {
        text-align: left;
      }
    }

    @media (max-width: 640px) {
      .app-shell {
        width: min(100% - 16px, 1180px);
        padding-top: 8px;
      }

      header {
        padding: 18px;
      }

      .trip-summary, summary, .details {
        grid-template-columns: 1fr;
      }

      summary {
        gap: 6px;
      }

      .chevron {
        display: none;
      }
    }
  </style>
</head>
<body>
  <section class="lock-screen" id="lockScreen">
    <div class="lock-panel">
      <h1>Travel Itinerary</h1>
      <form class="lock-form" id="unlockForm">
        <label for="passwordInput">Password</label>
        <input id="passwordInput" type="password" autocomplete="current-password" autofocus>
        <button class="unlock-button" type="submit">Unlock</button>
        <div class="lock-error" id="lockError" role="status"></div>
      </form>
    </div>
  </section>

  <div class="app-shell hidden" id="appShell">
    <header>
      <h1 id="pageTitle">Travel Itinerary</h1>
      <div class="meta" id="pageMeta"></div>
    </header>

    <section class="toolbar" aria-label="Itinerary controls">
      <div class="tabs" id="tabs" role="tablist"></div>
      <input class="search" id="search" type="search" placeholder="Search itinerary">
      <button class="icon-button" id="expandAll" type="button" title="Expand all">Expand</button>
      <button class="icon-button" id="collapseAll" type="button" title="Collapse all">Collapse</button>
    </section>

    <main>
      <section class="trip-panel" id="tripPanel" aria-live="polite"></section>
    </main>
  </div>

  <script>
    const encryptedPayload = JSON.parse(document.getElementById("encryptedItineraryData").textContent);
    let trips = [];
    let activeIndex = 0;

    const appShell = document.getElementById("appShell");
    const lockScreen = document.getElementById("lockScreen");
    const unlockForm = document.getElementById("unlockForm");
    const passwordInput = document.getElementById("passwordInput");
    const lockError = document.getElementById("lockError");
    const tabs = document.getElementById("tabs");
    const tripPanel = document.getElementById("tripPanel");
    const pageTitle = document.getElementById("pageTitle");
    const pageMeta = document.getElementById("pageMeta");
    const search = document.getElementById("search");

    function escapeText(value) {
      return String(value || "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function itemSearchText(item, day) {
      return [day, item.when, item.what, item.where, item.memo, item.linkLabel, item.cost].join(" ").toLowerCase();
    }

    function base64ToBytes(value) {
      return Uint8Array.from(atob(value), char => char.charCodeAt(0));
    }

    async function decryptTrips(password) {
      if (!window.crypto?.subtle) {
        throw new Error("This browser does not support Web Crypto on this page.");
      }

      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      const key = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(encryptedPayload.salt),
          iterations: encryptedPayload.iterations,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(encryptedPayload.iv) },
        key,
        base64ToBytes(encryptedPayload.ciphertext)
      );
      return JSON.parse(new TextDecoder().decode(plaintext));
    }

    function renderTabs() {
      tabs.innerHTML = trips.map((trip, index) => `
        <button class="tab" type="button" role="tab" aria-selected="${index === activeIndex}" data-index="${index}">
          ${escapeText(trip.label)}
        </button>
      `).join("");
    }

    function renderTrip() {
      const trip = trips[activeIndex];
      const term = search.value.trim().toLowerCase();
      pageTitle.textContent = trip.label;
      pageMeta.innerHTML = `
        <div>${escapeText(trip.dates)}</div>
        <div>${escapeText(trip.destination)}</div>
        <div>${escapeText(trip.travelers.filter(Boolean).join(" + "))}</div>
      `;

      const dayHtml = trip.days.map(day => {
        const items = day.items.filter(item => !term || itemSearchText(item, day.day).includes(term));
        if (!items.length) return "";
        return `
          <details class="day" open>
            <summary class="day-heading">
              <span>${escapeText(day.day)}</span>
              <span class="day-chevron">›</span>
            </summary>
            ${items.map((item, itemIndex) => renderItem(item, itemIndex)).join("")}
          </details>
        `;
      }).join("");

      tripPanel.innerHTML = `
        <div class="trip-summary">
          <div class="summary-cell">
            <div class="summary-label">Dates</div>
            <div>${escapeText(trip.dates)}</div>
          </div>
          <div class="summary-cell">
            <div class="summary-label">Destination</div>
            <div>${escapeText(trip.destination)}</div>
          </div>
          <div class="summary-cell">
            <div class="summary-label">Source tab</div>
            <div>${escapeText(trip.sheet)}</div>
          </div>
        </div>
        ${dayHtml || `<div class="summary-cell">No itinerary items match this search.</div>`}
      `;
    }

    function renderItem(item, itemIndex) {
      const link = item.url
        ? `<a href="${escapeText(item.url)}" target="_blank" rel="noreferrer">${escapeText(item.linkLabel || item.url)}</a>`
        : item.linkLabel ? `<span>${escapeText(item.linkLabel)}</span>` : "";
      const cost = item.cost ? `<span class="cost">${escapeText(item.cost)}</span>` : "";
      const memo = item.memo ? `<div class="memo">${escapeText(item.memo)}</div>` : "";
      return `
        <details class="item" ${itemIndex === 0 ? "open" : ""}>
          <summary>
            <div class="when">${escapeText(item.when || "Any time")}</div>
            <div class="what">
              <strong>${escapeText(item.what || "Untitled stop")}</strong>
              ${item.where ? `<div class="where">${escapeText(item.where)}</div>` : ""}
            </div>
            <div class="chevron">›</div>
          </summary>
          <div class="details">
            <div></div>
            <div class="detail-body">
              ${memo}
              ${link}
              ${cost}
            </div>
          </div>
        </details>
      `;
    }

    tabs.addEventListener("click", event => {
      const button = event.target.closest("button[data-index]");
      if (!button) return;
      activeIndex = Number(button.dataset.index);
      search.value = "";
      renderTabs();
      renderTrip();
    });

    search.addEventListener("input", renderTrip);

    document.getElementById("expandAll").addEventListener("click", () => {
      tripPanel.querySelectorAll("details").forEach(detail => detail.open = true);
    });

    document.getElementById("collapseAll").addEventListener("click", () => {
      tripPanel.querySelectorAll("details").forEach(detail => detail.open = false);
    });

    unlockForm.addEventListener("submit", async event => {
      event.preventDefault();
      const password = passwordInput.value;
      if (!password) {
        passwordInput.focus();
        return;
      }

      lockError.textContent = "Unlocking...";
      try {
        trips = await decryptTrips(password);
        passwordInput.value = "";
        lockScreen.classList.add("hidden");
        appShell.classList.remove("hidden");
        renderTabs();
        renderTrip();
      } catch (error) {
        lockError.textContent = "Incorrect password.";
        passwordInput.select();
      }
    });
  </script>
